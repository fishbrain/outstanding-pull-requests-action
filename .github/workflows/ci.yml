name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Match runs.using in action.yml.
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Smoke test the built action
        uses: ./
        with:
          basehead: ${{ github.event.repository.default_branch }}...${{ github.sha }}
          # High enough that it never posts, so the Slack inputs are never used.
          pullRequestThreshold: '1000000'
          slackToken: unused
          slackChannel: '#unused'
