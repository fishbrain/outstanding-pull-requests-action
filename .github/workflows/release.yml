name: Release

# Builds dist/ and commits it on top of main on a new release/vX.Y.Z branch, then tags that commit.
# main itself never contains dist/. Bump "version" in package.json before running this.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases must be run from main, not $GITHUB_REF."
          exit 1

      # Keep the write token out of .git/config; only the push step gets it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Match runs.using in action.yml.
          node-version: '26'
          cache: npm

      - name: Read version
        id: version
        run: |
          tag="v$(node -p 'require("./package.json").version')"
          # --exit-code: 0 if a ref exists, 2 if none do, anything else is an error.
          status=0
          git ls-remote --exit-code origin "refs/tags/$tag" "refs/heads/release/$tag" > /dev/null || status=$?
          if [ "$status" -eq 0 ]; then
            echo "::error::$tag or release/$tag already exists. Bump the version in package.json first."
            exit 1
          elif [ "$status" -ne 2 ]; then
            echo "::error::Could not check whether $tag exists (git ls-remote exited with $status)."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # No dependency needs install scripts, and this job can push.
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # No smoke test: it would run the bundle with this job's write token. CI smoke-tests every push to main.
      - run: npm run build

      - name: Commit dist/ to a release branch and tag it
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh auth setup-git
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --create "release/$TAG"
          git add --force dist/
          git commit --message "Release $TAG"
          git tag --annotate "$TAG" --message "$TAG"
          git push --atomic origin "refs/heads/release/$TAG" "refs/tags/$TAG"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
          {
            echo "## Released $TAG"
            echo
            echo 'Pin consumers to:'
            echo
            echo '```yaml'
            echo "uses: ${GITHUB_REPOSITORY}@${sha} # $TAG"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
